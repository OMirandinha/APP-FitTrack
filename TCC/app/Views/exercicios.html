<!DOCTYPE html>
<!-- Tela de inclusão e consulta do catálogo de exercícios. -->
<!-- Faltam gravar exercícios e carregar o catálogo real por meio do backend. -->
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Exercícios | SAT</title>
    <!-- Bootstrap organiza o layout; Font Awesome e Inter padronizam ícones e tipografia. -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <!-- Estilos compartilhados do aplicativo. -->
    <link rel="stylesheet" href="../../public/assets/css/app.css">
</head>

<body class="app-body" data-page="exercicios">
    <!-- Estrutura comum: a navegação lateral é montada pelo app.js. -->
    <div class="app-layout">
        <aside class="app-sidebar" data-app-sidebar></aside>
        <main class="app-main">
            <!-- Título preenchido pelo app.js e identificação provisória do usuário. -->
            <header class="app-topbar">
                <div>
                    <h1 data-page-title></h1>
                    <p>Catálogo de exercícios para seus planos.</p>
                </div>
                <div class="app-user"><span class="app-avatar"><i class="fas fa-user"
                            aria-hidden="true"></i></span><span>Visitante</span></div>
            </header>
            <!-- Aviso de que o conteúdo atual é apenas demonstrativo. -->
            <div class="app-notice" role="status">Protótipo: os exercícios de exemplo não são salvos no banco.</div>
            <div class="row g-4">
                <div class="col-lg-5">
                    <section class="app-card">
                        <h2>Novo exercício</h2>
                        <!-- Formulário visual; falta validar e persistir o exercício no backend. -->
                        <form class="app-form mt-3" data-demo-form
                            data-message="Exercício validado para demonstração. Para salvar, conecte o backend.">
                            <div class="mb-3"><label class="form-label" for="exercise-name">Nome</label><input
                                    class="form-control" id="exercise-name" name="nome"
                                    placeholder="Ex.: Agachamento livre" required></div>
                            <div class="mb-3"><label class="form-label" for="exercise-description">Descrição /
                                    orientação</label><textarea class="form-control" id="exercise-description"
                                    name="descricao" rows="4"></textarea></div>
                            <button class="btn app-button px-4" type="submit">Adicionar exercício</button>
                            <p class="mt-3 small" data-form-status role="status" hidden></p>
                        </form>
                    </section>
                </div>
                <div class="col-lg-7">
                    <section class="app-card">
                        <!-- Tabela de exemplos; deverá ser alimentada pelos exercícios cadastrados. -->
                        <h2>Catálogo</h2>
                        <div class="table-responsive mt-3">
                            <table class="table align-middle">
                                <thead>
                                    <tr>
                                        <th>Exercício</th>
                                        <th>Descrição</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr>
                                        <td>Agachamento livre</td>
                                        <td class="muted">Exemplo de exercício para demonstração.</td>
                                    </tr>
                                    <tr>
                                        <td>Supino reto</td>
                                        <td class="muted">Exemplo de exercício para demonstração.</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </section>
                </div>
            </div>
        </main>
    </div>
    <!-- Navegação compartilhada e comportamento demonstrativo dos formulários. -->
    <script src="../../public/assets/js/app.js"></script>
</body>

</html>
