<!DOCTYPE html>
<!-- Tela para registrar sessões e consultar o histórico de execução. -->
<!-- Faltam salvar os registros no banco e carregar o histórico real do aluno. -->
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Acompanhamento | SAT</title>
    <!-- Bootstrap organiza o layout responsivo; Font Awesome e Inter padronizam ícones e tipografia. -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <!-- Estilos compartilhados do aplicativo. -->
    <link rel="stylesheet" href="../../public/assets/css/app.css">
</head>

<body class="app-body" data-page="acompanhamento">
    <!-- Estrutura comum: a navegação lateral é montada pelo app.js. -->
    <div class="app-layout">
        <aside class="app-sidebar" data-app-sidebar></aside>
        <main class="app-main">
            <!-- Título preenchido pelo app.js e identificação provisória do usuário. -->
            <header class="app-topbar">
                <div>
                    <h1 data-page-title></h1>
                    <p>Registre sessões e acompanhe a evolução.</p>
                </div>
                <div class="app-user"><span class="app-avatar"><i class="fas fa-user"
                            aria-hidden="true"></i></span><span>Visitante</span></div>
            </header>
            <!-- Aviso informa que o protótipo não persiste os dados. -->
            <div class="app-notice" role="status">Protótipo: o histórico abaixo é demonstrativo e não é persistido.
            </div>
            <div class="row g-4">
                <div class="col-lg-5">
                    <section class="app-card">
                        <h2>Registrar treino</h2>
                        <!-- Formulário com validação visual; falta enviar e persistir a sessão no backend. -->
                        <form class="app-form mt-3" data-demo-form
                            data-message="Registro validado para demonstração. Para salvar, conecte o backend.">
                            <div class="mb-3"><label class="form-label" for="training-name">Treino
                                    realizado</label><input class="form-control" id="training-name" name="treino"
                                    placeholder="Ex.: Treino A" required></div>
                            <div class="mb-3"><label class="form-label" for="training-date">Data</label><input
                                    class="form-control" id="training-date" name="data" type="date" required></div>
                            <div class="mb-3"><label class="form-label"
                                    for="training-notes">Observações</label><textarea class="form-control"
                                    id="training-notes" name="observacoes" rows="4"
                                    placeholder="Como foi a sessão?"></textarea></div>
                            <button class="btn app-button px-4" type="submit">Registrar sessão</button>
                            <p class="mt-3 small" data-form-status role="status" hidden></p>
                        </form>
                    </section>
                </div>
                <div class="col-lg-7">
                    <section class="app-card">
                        <!-- Esta área deverá listar os registros retornados pela aplicação. -->
                        <h2>Histórico de execução</h2>
                        <p class="muted mt-3">Nenhuma sessão registrada. Seus registros de execução aparecerão aqui.</p>
                    </section>
                </div>
            </div>
        </main>
    </div>
    <!-- Navegação compartilhada e comportamento demonstrativo dos formulários. -->
    <script src="../../public/assets/js/app.js"></script>
</body>

</html>
