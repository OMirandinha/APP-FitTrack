<!DOCTYPE html>
<!-- Tela de cadastro e consulta de alunos. -->
<!-- Faltam integração com backend/banco, listagem persistente e edição/remoção de alunos. -->
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Alunos | SAT</title>
    <!-- Bootstrap organiza o layout; Font Awesome e Inter padronizam ícones e tipografia. -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <!-- Estilos compartilhados do aplicativo. -->
    <link rel="stylesheet" href="../../public/assets/css/app.css">
</head>

<body class="app-body" data-page="alunos">
    <!-- Estrutura comum: a navegação lateral é montada pelo app.js. -->
    <div class="app-layout">
        <aside class="app-sidebar" data-app-sidebar></aside>
        <main class="app-main">
            <!-- Título preenchido pelo app.js e identificação provisória do usuário. -->
            <header class="app-topbar">
                <div>
                    <h1 data-page-title></h1>
                    <p>Cadastro e organização dos alunos.</p>
                </div>
                <div class="app-user"><span class="app-avatar"><i class="fas fa-user"
                            aria-hidden="true"></i></span><span>Visitante</span></div>
            </header>
            <!-- Aviso de que os dados permanecem somente na demonstração. -->
            <div class="app-notice" role="status">Protótipo: os dados de exemplo não são salvos no banco.</div>
            <div class="row g-4">
                <div class="col-lg-5">
                    <section class="app-card">
                        <h2>Novo aluno</h2>
                        <!-- Formulário visual; falta encaminhar os dados e gravá-los no banco. -->
                        <form class="app-form mt-3" data-demo-form
                            data-message="Cadastro validado para demonstração. Para salvar, conecte o backend.">
                            <div class="mb-3"><label class="form-label" for="student-name">Nome completo</label><input
                                    class="form-control" id="student-name" name="nome" required></div>
                            <div class="mb-3"><label class="form-label" for="student-email">E-mail</label><input
                                    class="form-control" id="student-email" name="email" type="email" required></div>
                            <div class="mb-3"><label class="form-label" for="student-weight">Peso (kg)</label><input
                                    class="form-control" id="student-weight" name="peso" type="number" min="1"
                                    step="0.1"></div>
                            <button class="btn app-button px-4" type="submit">Cadastrar aluno</button>
                            <p class="mt-3 small" data-form-status role="status" hidden></p>
                        </form>
                    </section>
                </div>
                <div class="col-lg-7">
                    <section class="app-card">
                        <!-- A lista deverá ser preenchida com alunos obtidos do backend. -->
                        <h2>Alunos cadastrados</h2>
                        <p class="muted mt-2">Nenhum aluno carregado. A lista será exibida aqui quando a integração com
                            o banco estiver pronta.</p>
                    </section>
                </div>
            </div>
        </main>
    </div>
    <!-- Navegação compartilhada e comportamento demonstrativo dos formulários. -->
    <script src="../../public/assets/js/app.js"></script>
</body>

</html>
