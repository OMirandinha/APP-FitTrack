<!DOCTYPE html>
<!-- Tela de demonstração para comunicação entre profissionais e alunos. -->
<!-- Faltam persistência, identificação dos participantes e envio/recebimento de mensagens. -->
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mensagens | SAT</title>
    <!-- Bootstrap organiza o layout; Font Awesome e Inter padronizam ícones e tipografia. -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <!-- Estilos compartilhados do aplicativo. -->
    <link rel="stylesheet" href="../../public/assets/css/app.css">
</head>

<body class="app-body" data-page="mensagens">
    <!-- Estrutura comum: a navegação lateral é montada pelo app.js. -->
    <div class="app-layout">
        <aside class="app-sidebar" data-app-sidebar></aside>
        <main class="app-main">
            <!-- Título preenchido pelo app.js e identificação provisória do usuário. -->
            <header class="app-topbar">
                <div>
                    <h1 data-page-title></h1>
                    <p>Comunicação entre profissionais e alunos.</p>
                </div>
                <div class="app-user"><span class="app-avatar"><i class="fas fa-user"
                            aria-hidden="true"></i></span><span>Visitante</span></div>
            </header>
            <!-- Aviso de que a conversa não possui integração ativa. -->
            <div class="app-notice" role="status">Protótipo: mensagens não são enviadas nem armazenadas.</div>
            <section class="app-card">
                <h2>Conversa de demonstração</h2>
                <!-- Conteúdo fixo de exemplo; no futuro deverá exibir a conversa real. -->
                <div class="border rounded-3 p-3 mt-3 mb-4" aria-live="polite">
                    <p class="mb-0"><strong>Equipe SAT:</strong> Este espaço poderá ser usado para orientações e dúvidas
                        entre alunos e profissionais.</p>
                </div>
                <!-- Campo de composição; falta enviar e armazenar a mensagem. -->
                <form class="app-form" data-demo-form
                    data-message="Mensagem exibida apenas nesta demonstração; ela não foi enviada.">
                    <label class="form-label" for="message-content">Escreva uma mensagem</label>
                    <div class="input-group"><input class="form-control" id="message-content" name="mensagem"
                            placeholder="Digite sua mensagem" required><button class="btn app-button px-4"
                            type="submit">Enviar</button></div>
                    <p class="mt-3 small" data-form-status role="status" hidden></p>
                </form>
            </section>
        </main>
    </div>
    <!-- Navegação compartilhada e comportamento demonstrativo dos formulários. -->
    <script src="../../public/assets/js/app.js"></script>
</body>

</html>
